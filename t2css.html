<!DOCTYPE html>
<html>
<head>
  <style>
    .nav-container {
      display: flex;
      gap: 40px; /* spacing between the two bars */
    }

    .nav-section {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .vertical-nav {
      width: 150px;
      background-color: lightblue;
      border: 1px solid black;
    }

    .vertical-nav a {
      display: block;
      padding: 10px;
      text-decoration: none;
      font-family: Arial;
      color: blue;
    }

    .vertical-nav a:first-child {
      background-color: orange;
      color: white;
    }

    .horizontal-nav a {
      display: inline-block;
      padding: 10px 20px;
      text-decoration: none;
      font-family: Arial;
      color: blue;
      border-right: 1px solid gray;
    }

    .horizontal-nav a:first-child {
      background-color: gray;
      color: white;
    }

    /* Cement color for programming languages */
    .horizontal-nav a.java,
    .horizontal-nav a.html,
    .horizontal-nav a.css {
      background-color: #B8B8B8; /* Cement-like color */
      color: black;
    }
  </style>
</head>
<body>

<div class="nav-container">
  <!-- Vertical Nav Section -->
  <div class="nav-section">
    <h3>Vertical Navigation Bar</h3>
    <div class="vertical-nav">
      <a href="#">Home</a>
      <a href="#">Java</a>
      <a href="#">CSS</a>
      <a href="#">HTML</a>
      <a href="#">Bootstrap</a>
    </div>
  </div>

  <!-- Horizontal Nav Section -->
  <div class="nav-section">
    <h3>Horizontal Navigation Bar</h3>
    <div class="horizontal-nav">
      <a href="#">Home</a>
      <a href="#" class="java">Java</a>
      <a href="#" class="html">HTML</a>
      <a href="#" class="css">CSS</a>
    </div>
  </div>
</div>

</body>
</html>
