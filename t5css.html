<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
    }

    .login-container {
      width: 320px;
      margin: 50px auto;
      padding: 20px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    .avatar {
      width: 100px;
      border-radius: 50%;
      margin-bottom: 20px;
    }

    input[type="text"],
    input[type="password"] {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button.login {
      width: 95%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      margin-top: 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 13px;
      padding: 0 5px;
    }

    .options input[type="checkbox"] {
      margin-right: 5px;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    .actions button {
      width: 48%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .cancel {
      background-color: red;
      color: white;
    }

    .forgot {
      background: none;
      color: #4CAF50;
      text-decoration: none;
      padding: 10px;
      text-align: right;
    }
  </style>
</head>
<body>

<div class="login-container">
  <img src="https://cdn-icons-png.flaticon.com/512/194/194938.png" alt="Avatar" class="avatar">
  <form>
    <label><b>Username</b></label><br>
    <input type="text" placeholder="Enter Username"><br>

    <label><b>Password</b></label><br>
    <input type="password" placeholder="Enter Password"><br>

    <button type="submit" class="login">Login</button>

    <div class="options">
      <label><input type="checkbox"> Remember me</label>
    </div>

    <div class="actions">
      <button type="button" class="cancel">Cancel</button>
      <a href="#" class="forgot">Forgot password?</a>
    </div>
  </form>
</div>

</body>
</html>
