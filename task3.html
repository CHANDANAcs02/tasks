<!DOCTYPE html>
<html>
<head>
    <title>Task 3</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
        }
        table {
            border-collapse: collapse;
            margin: auto;
            width: 600px;
        }
        th {
            text-align: center;
            font-size: 20px;
            padding: 10px;
        }
        td {
            border: 1px solid #000;
            padding: 8px;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        input[type="tel"],
        select,
        textarea {
            width: 95%;
            padding: 5px;
        }
        .full-width {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <form>
            <table>
                <tr>
                    <th colspan="2">Registration form</th>
                </tr>
                <tr>
                    <td>First Name</td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td>Last Name</td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td>Email</td>
                    <td><input type="email"></td>
                </tr>
                <tr>
                    <td>Password</td>
                    <td><input type="password"></td>
                </tr>
                <tr>
                    <td>Re-enter Password</td>
                    <td><input type="password"></td>
                </tr>
                <tr>
                    <td>Gender</td>
                    <td>
                        <input type="radio" name="gender"> Male
                        <input type="radio" name="gender"> Female
                    </td>
                </tr>
                <tr>
                    <td>Age</td>
                    <td><input type="number"></td>
                </tr>
                <tr>
                    <td>Phone Number</td>
                    <td><input type="tel"></td>
                </tr>
                <tr>
                    <td>Address</td>
                    <td><textarea rows="3"></textarea></td>
                </tr>
                <tr>
                    <td>State</td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td>Country</td>
                    <td>
                        <select>
                            <option>Choose your country</option>
                            <option>India</option>
                            <option>USA</option>
                            <option>UK</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Languages known</td>
                    <td>
                        <input type="checkbox"> English
                        <input type="checkbox"> Kannada
                        <input type="checkbox"> Hindi
                        <input type="checkbox"> Telugu
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <input type="checkbox"> Hereby I declare all the given details are true
                    </td>
                </tr>
                <tr>
                    <td colspan="2" class="full-width">
                        <a href="https://www.acharya.ac.in" target="_blank">Log in to Acharya website</a>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" class="full-width">
                        <input type="submit" value="Register">
                    </td>
                </tr>
            </table>
        </form>
    </div>
</body>
</html>
