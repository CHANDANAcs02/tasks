<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    h2 {
      color: #4169E1;
      padding: 20px;
    }

    .sidenav {
      position: fixed;
      top: 100px; /* Push down below the Task 4 heading */
      left: 0;
      height: auto;
      width: 60px;
    }

    .sidenav a {
      position: relative;
      display: block;
      height: 50px;
      width: 60px;
      padding-left: 10px;
      color: white;
      text-decoration: none;
      font-size: 16px;
      line-height: 50px;
      transition: 0.3s;
      overflow: hidden;
    }

    .sidenav a span {
      position: absolute;
      left: 60px;
      top: 0;
      height: 100%;
      width: 120px;
      background-color: inherit;
      color: white;
      line-height: 50px;
      padding-left: 10px;
      white-space: nowrap;
      opacity: 0;
      transition: 0.3s;
    }

    .sidenav a:hover span {
      opacity: 1;
    }

    .green { background-color: #04AA6D; }
    .blue { background-color: #2196F3; }
    .red { background-color: #f44336; }
    .gray { background-color: #555; }

    .main-content {
      margin-left: 80px;
      margin-top: 20px;
      border: 1px solid #ccc;
      padding: 20px;
      width: fit-content;
    }

    .main-content h3 {
      margin-top: 0;
    }
  </style>
</head>
<body>

<h2>Task 4</h2>

<div class="sidenav">
  <a href="#" class="green"><span>Home</span></a>
  <a href="#" class="blue"><span>Java</span></a>
  <a href="#" class="red"><span>CSS</span></a>
  <a href="#" class="gray"><span>HTML</span></a>
</div>

<div class="main-content">
  <h3>Hoverable Sidenav Buttons</h3>
  <p>Hover over the buttons in the left side navigation to open them.</p>
</div>

</body>
</html>
