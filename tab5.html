<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Form Validation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .form-control:invalid {
      border-color: #dc3545;
    }
    .form-control:invalid ~ .invalid-feedback {
      display: block;
    }
    .form-control:valid ~ .invalid-feedback {
      display: none;
    }
  </style>
</head>
<body class="bg-light">

<div class="container mt-5">
  <form class="bg-white p-4 rounded shadow-sm needs-validation" novalidate>
    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input type="text" class="form-control is-invalid" id="name" required>
      <div class="invalid-feedback">Name is required</div>
    </div>
    
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control is-invalid" id="email" required>
      <div class="invalid-feedback">Email is required</div>
    </div>
    
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control is-invalid" id="password" required>
      <div class="invalid-feedback">Password is required</div>
    </div>
    
    <div class="mb-3">
      <label for="hobbies" class="form-label">Hobbies</label>
      <select class="form-select" id="hobbies">
        <option selected disabled value="">Choose...</option>
        <option>Reading</option>
        <option>Sports</option>
        <option>Music</option>
      </select>
    </div>
    
    <button type="submit" class="btn btn-danger w-100">Submit</button>
  </form>
</div>

<script>
  // Optional client-side validation handling
  (() => {
    'use strict';
    const forms = document.querySelectorAll('.needs-validation');
    Array.from(forms).forEach(form => {
      form.addEventListener('submit', event => {
        if (!form.checkValidity()) {
          event.preventDefault();
          event.stopPropagation();
        }
        form.classList.add('was-validated');
      }, false);
    });
  })();
</script>

</body>
</html>
