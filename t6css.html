<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My first styled page</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Georgia, serif;
      background-color: #dcdc55;
    }

    .container {
      display: flex;
      max-width: 900px;
      margin: 20px auto;
      padding: 20px;
      background-color: #dcdc55;
    }

    .menu {
      padding: 0;
      margin: 0;
      list-style: none;
      width: 150px;
    }

    .menu li {
      margin-bottom: 5px;
    }

    .menu a {
      display: block;
      padding: 5px;
      background-color: #ffffff;
      color: #3333cc;
      text-decoration: none;
      border-left: 10px solid black;
      font-family: Verdana, sans-serif;
    }

    .content {
      margin-left: 40px;
      flex: 1;
    }

    h1 {
      color: #660066;
      font-family: Verdana, sans-serif;
    }

    p {
      margin: 10px 0;
    }

    hr {
      border: none;
      border-top: 1px dotted gray;
      margin: 20px 0;
      width: 100%;
    }

    address {
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <ul class="menu">
      <li><a href="#">Home page</a></li>
      <li><a href="#">Musings</a></li>
      <li><a href="#">My town</a></li>
      <li><a href="#">Links</a></li>
    </ul>

    <div class="content">
      <h1>My first styled page</h1>

      <p>Welcome to my styled page!</p>

      <p>It lacks images, but at least it has style. And it has links, even if they don’t go anywhere...</p>

      <p>There should be more here, but I don’t know what yet.</p>

      <hr>

      <address>
        Made 5 April 2004<br>
        by myself.
      </address>
    </div>
  </div>
</body>
</html>
